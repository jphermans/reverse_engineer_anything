name: CI

on:
  push:
  pull_request:

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer mapping tests
        run: python tests/test_installer.py
      - name: Quota tests
        run: python tests/test_quota.py
