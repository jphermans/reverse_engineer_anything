name: CI

on:
  push:
  pull_request:

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer mapping tests
        run: python tests/test_installer.py
      - name: Quota tests
        run: python tests/test_quota.py
      - name: Install API hang-fix tests
        run: python tests/test_install_api.py
      - name: JS ESM syntax check
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./.git/*"); do
            cp "$f" /tmp/chk.mjs
            if ! node --check /tmp/chk.mjs 2>/tmp/chk.err; then
              echo "FAIL $f"
              cat /tmp/chk.err
              fail=1
            fi
          done
          exit $fail
